[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"

# Security headers and caching come from dist/_headers, which is generated by
# scripts/gen-headers.mjs during the build so the CSP script hashes cannot go
# stale. Do not duplicate them here — Netlify would merge the two and the
# stricter policy would be the one that broke.

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
