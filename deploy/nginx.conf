server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Security headers, generated with per-script CSP hashes by
  # scripts/gen-headers.mjs during the build.
  include /etc/nginx/conf.d/headers.conf;

  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/markdown application/javascript
             application/json application/xml image/svg+xml;

  # Astro builds with format:'directory', so /pricing -> /pricing/index.html.
  # try_files handles that without a redirect hop.
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  # Fingerprinted assets never change under the same name.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Machine-readable mirrors should be served as text, not downloaded.
  location ~* \.(md|txt)$ {
    default_type text/plain;
    charset utf-8;
  }

  error_page 404 /404/index.html;

  location = /404/index.html {
    internal;
  }
}
